apiVersion: godpowers/v1
kind: CommandRouting
metadata:
  command: /god-polish
  invocation-policy: suggestible
  description: Bounded post-green visual polish loop
  tier: 3
  family: build

prerequisites:
  required:
    - check: state:tier-2.build.status == done
      auto-complete: /god-build
      human-required: true
    - DESIGN.md

execution:
  spawns: [god-browser-tester]
  context: fresh
  secondary-spawns: [god-executor, god-spec-reviewer, god-quality-reviewer]
  writes:
    - .godpowers/polish/POLISH.mdx
    - .godpowers/state.json

standards:
  substitution-test: true
  three-label-test: true
  have-nots: [U-01, U-02, U-03, U-04, U-05, U-06, U-07, U-08, U-09, U-10, U-11, U-12, U-13, U-14]
  gate-on-failure: pause-for-user

success-path:
  next-recommended: /god-review-changes

failure-path:
  on-error: /god-doctor

endoff:
  state-update: tier-3 updated for /god-polish
  events: [agent.start, polish.round, polish.closed, agent.end]
