apiVersion: godpowers/v1
kind: CommandRouting
metadata:
  command: /god-refactor
  invocation-policy: suggestible
  description: Safe refactor with TDD
  tier: 0
  family: build

prerequisites:
  required:
    - check: state:tier-2.repo.status == done
      auto-complete: /god-add-tests
      human-required: true
    - check: tests-exist-on-affected-surface
      auto-complete: /god-add-tests
      human-required: true

execution:
  spawns: [god-explorer]
  context: fresh
  secondary-spawns: [god-auditor, god-planner, god-executor, god-spec-reviewer, god-quality-reviewer]
  writes:
    []


success-path:
  next-recommended: /god-status

  post-success-actions:
    - run: /god-scan
      reason: refresh linkage map; surface drift to REVIEW-REQUIRED.md
failure-path:
  on-error: /god-doctor

endoff:
  state-update: tier-0 updated for /god-refactor
  events: [agent.start, artifact.created, agent.end, linkage.snapshot, drift.detected, review-required.populated]
