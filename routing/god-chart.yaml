apiVersion: godpowers/v1
kind: CommandRouting
metadata:
  command: /god-chart
  invocation-policy: suggestible
  description: Chart a decision map for work too big for one session
  tier: 0
  family: start
  trigger-precedence:
    - trigger: too big for one session
      prefer: /god-chart
      when: destination-nameable-but-route-foggy
      fallback: /god-explore
      reason: Charting fits when the end state is nameable but the route is not; broad ideation stays in explore.

prerequisites:
  required:
    - check: state:initialized == true
      auto-complete: /god-init
      human-required: false

execution:
  spawns: [god-cartographer]
  context: fresh
  reads:
    - .godpowers/prd/PRD.mdx
    - .godpowers/arch/ARCH.mdx
    - .godpowers/roadmap/ROADMAP.mdx
  writes:
    - .godpowers/charts/<slug>/CHART.mdx
    - .godpowers/stories/<slug>/STORY-<slug>-NNN.mdx
  secondary-spawns: [god-spike-runner]

standards:
  substitution-test: true
  three-label-test: true
  have-nots: [W-01, W-02, W-03, W-04, W-05, W-06, W-07, W-08]
  gate-on-failure: pause-for-user

success-path:
  next-recommended: varies
  outcome:
    type: contextual
    label: Context-specific next route
    reason: The next route depends on whether the chart still has open units, remaining fog, or neither.
    allowed-next: [/god-chart, /god-stories, /god-prd, /god-feature]
  alternatives:
    - command: /god-prd
      when: charting-surfaced-no-fog
    - command: /god-stories
      when: user-wants-the-whole-board

failure-path:
  on-error: /god-doctor

endoff:
  state-update: tier-0 updated for /god-chart
  events: [agent.start, artifact.created, agent.end]
