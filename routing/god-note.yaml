apiVersion: godpowers/v1
kind: CommandRouting
metadata:
  command: /god-note
  invocation-policy: suggestible
  description: Zero-friction idea capture
  tier: 0
  family: capture

prerequisites:
  required: []

execution:
  spawns: [built-in]
  context: fresh
  writes: []

success-path:
  next-recommended: /god-next

failure-path:
  on-error: /god-doctor

endoff:
  state-update: tier-0 updated for /god-note
  events: [agent.start, agent.end]
