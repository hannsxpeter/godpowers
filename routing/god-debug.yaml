apiVersion: godpowers/v1
kind: CommandRouting
metadata:
  command: /god-debug
  invocation-policy: suggestible
  description: 6-phase systematic debug with independent review before commit
  tier: 0
  family: build

prerequisites:
  required:
    []

execution:
  spawns: [god-debugger, god-spec-reviewer, god-quality-reviewer]
  context: fresh
  writes:
    - regression test
    - fix


success-path:
  next-recommended: /god-status

failure-path:
  on-error: /god-doctor

endoff:
  state-update: tier-0 updated for /god-debug
  events: [agent.start, artifact.created, agent.end]
