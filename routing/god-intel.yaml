apiVersion: godpowers/v1
kind: CommandRouting
metadata:
  command: /god-intel
  invocation-policy: suggestible
  description: Query/refresh codebase intel
  tier: 0
  family: maintain

prerequisites:
  required: []

execution:
  spawns: [built-in]
  context: fresh
  writes: []

success-path:
  next-recommended: /god-next

failure-path:
  on-error: /god-doctor

endoff:
  state-update: tier-0 updated for /god-intel
  events: [agent.start, agent.end]
