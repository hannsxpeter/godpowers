apiVersion: godpowers/v1
kind: Extension
metadata:
  name: "@godpowers/provenance-pack"
  version: 0.1.0
  description: |
    Authorized AI provenance inspection and cleaning through a user-operated
    watermarks-remover service. Inspect first, preserve sources by default,
    and report residual risk without authorship claims.
  homepage: https://github.com/hannsxpeter/godpowers/tree/main/extensions/provenance-pack
  license: MIT

engines:
  godpowers: ">=5.17.1 <7.0.0"

provides:
  agents:
    - god-ai-provenance-cleaner
  skills:
    - god-remove-ai-marks
  have-nots:
    - prefix: PROV
      description: Authorized provenance-cleaning safety and honesty failures

activation:
  on:
    - skill: /god-remove-ai-marks
    - extension-list-query: true
