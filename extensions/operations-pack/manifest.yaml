apiVersion: godpowers/v1
kind: Extension
metadata:
  name: "@godpowers/operations-pack"
  version: 0.1.0
  description: |
    Maintainer-approved issue triage and human-run setup wizards. Tracker
    mutations wait for approval, and generated wizards are statically checked
    but never run end to end by an agent.
  homepage: https://github.com/hannsxpeter/godpowers/tree/main/extensions/operations-pack
  license: MIT

engines:
  godpowers: ">=6.2.0 <7.0.0"

provides:
  agents:
    - god-issue-triager
    - god-setup-wizard
  skills:
    - god-issue-triage
    - god-setup-wizard
  have-nots:
    - prefix: OPS
      description: Issue-tracker authority and human-only wizard safety failures

activation:
  on:
    - skill: /god-issue-triage
    - skill: /god-setup-wizard
    - extension-list-query: true
