name: Publish extension pack

# Implements: P-SHOULD-08

# Manually publish a first-party extension pack to npm. Triggered from
# the GitHub Actions UI (workflow_dispatch). Bump the pack's package.json
# version first, then run this workflow with the pack name.

on:
  workflow_dispatch:
    inputs:
      pack:
        description: 'Pack to publish (security-pack, launch-pack, data-pack, provenance-pack)'
        required: true
        type: choice
        options:
          - security-pack
          - launch-pack
          - data-pack
          - provenance-pack
      version:
        description: 'Exact package version and tag suffix to publish'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @godpowers/${{ inputs.pack }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned official Agent Skills validator
        run: python -m pip install -r requirements/skills-ref.txt

      - name: Verify merged tag and pack identity
        shell: bash
        run: |
          set -euo pipefail
          pack="${{ inputs.pack }}"
          requested_version="${{ inputs.version }}"
          expected_tag="${pack}-v${requested_version}"
          package_name="$(node -p "require('./extensions/${pack}/package.json').name")"
          package_version="$(node -p "require('./extensions/${pack}/package.json').version")"
          if [[ "$package_name" != "@godpowers/$pack" || "$package_version" != "$requested_version" ]]; then
            echo "Selected pack identity does not match @godpowers/$pack@$requested_version."
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
            echo "Dispatch this workflow from the exact tag $expected_tag."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Selected pack commit is not merged into main."
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$expected_tag^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "Tag $expected_tag does not identify the checked-out commit."
            exit 1
          fi

      - name: Verify pack publishability
        run: npm run release:check

      - name: Verify fresh pre-publication gate
        run: npm run release:prepublication:check

      - name: Publish pack
        working-directory: extensions/${{ inputs.pack }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --access public
