name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned official Agent Skills validator
        run: python -m pip install -r requirements/skills-ref.txt

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          mcp_version="$(node -p "require('./packages/mcp/package.json').version")"
          if [[ "$tag_version" != "$root_version" || "$tag_version" != "$mcp_version" ]]; then
            echo "Tag v$tag_version does not match root $root_version and MCP $mcp_version."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tagged commit is not merged into main."
            exit 1
          fi

      - name: Release gate
        run: npm run release:check

      - name: Verify fresh pre-publication gate
        run: npm run release:prepublication:check

      - name: Publish godpowers to a recoverable staging tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          staging_tag="release-${version//./-}"
          set +e
          lookup="$(npm view "godpowers@$version" version 2>&1)"
          lookup_status=$?
          set -e
          if [[ $lookup_status -eq 0 ]]; then
            echo "godpowers@$version already exists; preserving it for an idempotent recovery run."
          elif grep -q 'E404' <<<"$lookup"; then
            npm publish --provenance --access public --tag "$staging_tag"
          else
            echo "$lookup"
            echo "Registry state is uncertain; refusing to publish."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @godpowers/mcp to the same staging tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/mcp/package.json').version")"
          staging_tag="release-${version//./-}"
          set +e
          lookup="$(npm view "@godpowers/mcp@$version" version 2>&1)"
          lookup_status=$?
          set -e
          if [[ $lookup_status -eq 0 ]]; then
            echo "@godpowers/mcp@$version already exists; preserving it for an idempotent recovery run."
          elif grep -q 'E404' <<<"$lookup"; then
            npm publish --workspace @godpowers/mcp --provenance --access public --tag "$staging_tag"
          else
            echo "$lookup"
            echo "Registry state is uncertain; refusing to publish."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the exact package pair before promotion
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          verify_exact_version() {
            package_spec="$1"
            for attempt in {1..12}; do
              if actual="$(npm view "$package_spec@$version" version 2>/dev/null)" && [[ "$actual" == "$version" ]]; then
                return 0
              fi
              if [[ "$attempt" -lt 12 ]]; then
                sleep 10
              fi
            done
            echo "Registry propagation did not expose $package_spec@$version after 12 attempts."
            return 1
          }
          verify_exact_version "godpowers"
          verify_exact_version "@godpowers/mcp"

      - name: Promote the verified pair to latest
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          npm dist-tag add "@godpowers/mcp@$version" latest
          npm dist-tag add "godpowers@$version" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
